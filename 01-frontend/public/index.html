<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask + Express App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>Flask Backend + Express Frontend</h1>
            <p class="subtitle">A simple full-stack application</p>
        </header>

        <main class="app-content">
            <section class="data-section">
                <h2>Message from Backend</h2>
                <div class="message-box" id="message">Loading message...</div>
            </section>

            <section class="action-section">
                <button class="refresh-btn" id="refreshBtn">Refresh Message</button>
            </section>
        </main>

        <footer class="app-footer">
            <p>Simple full-stack application using Flask and Express</p>
        </footer>
    </div>

    <script>
        async function fetchMessage() {
            try {
                const response = await fetch('/api/message');
                const data = await response.json();
                document.getElementById('message').textContent = data.message;
                document.getElementById('message').classList.add('success');
            } catch (error) {
                document.getElementById('message').textContent = 'Failed to load message';
                document.getElementById('message').classList.add('error');
            }
        }

        // Initial load
        fetchMessage();

        // Refresh button
        document.getElementById('refreshBtn').addEventListener('click', () => {
            document.getElementById('message').textContent = 'Loading...';
            document.getElementById('message').classList.remove('success', 'error');
            fetchMessage();
        });
    </script>
</body>
</html>
